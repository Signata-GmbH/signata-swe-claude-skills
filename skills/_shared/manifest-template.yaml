# =====================================================================
# MODULE MANIFEST  —  module: <MODULE_NAME>
# ---------------------------------------------------------------------
# ONE per module, shared by the three AI skills. INHERITS the per-repo
# project config (20_AI/ai_project.yaml) — project facts (compiler, target,
# layout, flavor, variants, docs) live there, NOT here. This file holds only
# MODULE-specific inputs + the skill-owned run ledgers.
#
# Flavor: fields tagged  # [A] autosar-only  or  # [N] nonautosar-only are
# emitted by the skill only when they match project.type; untagged fields
# apply to both. The skill scaffolds the correct subset on first run.
#
# `last_run:` blocks are SKILL-OWNED — do not hand-edit. They drive in-place
# re-runs and form the audit trail (which skill version + which source
# revision + which requirement revision produced which output). Older
# manifests carry `timestamp:` (= run end) instead of run_id/started/ended;
# the next run replaces it.
#
# Every run commits this file itself, at each gate and at the end
# (run-tracking.md §3) — never leave it for a manual commit.
#
# LOCATION (derived by the skills):  20_AI/manifests/<MODULE_NAME>.yaml
# =====================================================================

schema_version: 1
inherits: 20_AI/ai_project.yaml     # project-level config; do not duplicate its fields here

module:
  name:        <MODULE_NAME>        # <-- fill   e.g. FUSA_PosDet | SAPF_Mode
  upper:       <MODULE_UPPER>       # derived    e.g. FUSA_POSDET | SAPF_MODE
  asil:        inherit              # inherit project default, or override e.g. ASIL-B(D)
  cycle_times: <CYCLE_TIMES>        # <-- fill   e.g. "10 ms cyclic + Init (once)"

# PER-MODULE documents (extend/override the project-wide docs in ai_project.yaml).
docs:
  sdd:              <path>          # <-- fill   MANDATORY (all skills) — per-module Software Detailed Design (.pdf/.xlsx)
  architecture:     inherit        # inherit the project ADD, or a module-specific section path (.pdf/.xlsx).
                                   #   OPTIONAL but asked explicitly; N/A only via explicit engineer decision.
  extra:            []             # optional additional documents to consider on a run (U2)
  run_instructions: ""             # optional free-text custom instructions for a run (U2)

# ---------------------------------------------------------------------
# CODE DEVELOPMENT   (/autosar-code-dev or /code-dev)
# ---------------------------------------------------------------------
code_dev:
  # -- scope (mechanism depends on project.type / requirements.scoping) --
  related_modules:    []            # [A] sibling modules whose reqs also apply ([] if none)
  expected_row_count: "?"           # [A] filtered-row count (incl. related_modules); "?" learns it
  sw_req_ids:         []            # [N] explicit SW_Req IDs — no reliable module column
  release_filter:     N/A           # [N] alt. to sw_req_ids, e.g. 'aRequiredForRelease == "B0-Sample"'
  # -- both flavors --
  peer_anchors:       []            # <-- fill  style-reference modules (never modified)
  known_deferrals:    []            # <-- optional  seed the Deferred Items table
  open_questions:     []            # <-- optional  seed Phase-1; mirrored to 20_AI/<MODULE>_Phase1_Questions_<Skill>.xlsx

  last_run:                         # SKILL-OWNED ledger
    run_id:           null          # <skill>-<MODULE>-<UTC start> (run-tracking.md §1); commits carry it as AI-Run:
    started:          null          # UTC, from the shell clock — never written from memory
    ended:            null
    timing:           {}            # total_s, engineer_wait_s, ai_active_s, sessions (run-tracking.md §4)
    skill_version:    null
    source_sha:       null          # git SHA the run was authored against (revision pinning)
    requirements_sha: null          # digest of the whole filtered set (scope-drift guard)
    requirements:     {}            # ID -> { hash, files: [file:line, ...] }
    files_created:    []
    implementation_review: null     # path of the Implementation Review document
    deferred_items:   []

# ---------------------------------------------------------------------
# CODE FIX   (/code-fix)  —  one entry per reported defect
# ---------------------------------------------------------------------
code_fix:
  issue_seq:  0                     # SKILL-OWNED  last auto-coined <MODULE_UPPER>-FIX-NNN number
  issues:     []                    # SKILL-OWNED  append-only per-issue record; re-runs update in place:
                                    #   - id:            SAPF_MODE-FIX-001   # or the tracker ID (Jira/Polarion/DOORS)
                                    #     opened:        2026-09-18
                                    #     observed:      "…"                 # engineer's words, verbatim
                                    #     expected:      "…"
                                    #     expectation_source: SW_Requ-123 | TC-456 | engineer-judgement
                                    #     evidence:      []                  # [{kind, ref, digest}] kind per defect-analysis §2
                                    #     evidence_build: <sha|tag|release>   # build the observation was made on
                                    #     verdict:       V1 | V2 | V3 | V4    # defect-analysis §5
                                    #     root_cause:    "file:line — mechanism"
                                    #     requirements:  []                  # IDs the symptom touches
                                    #     files_changed: []
                                    #     report:        20_AI/CodeFix/<MODULE>_<ID>_FixReport.md
                                    #     tests_invalidated: []              # existing unit-test cases the fix changes
                                    #     follow_ups:    []                  # /unit-test, /code-review diff, req change request
                                    #     status:        analysed | fix-proposed | fix-applied | no-change | blocked

  last_run:                         # SKILL-OWNED ledger
    run_id:           null          # <skill>-<MODULE>-<UTC start> (run-tracking.md §1); commits carry it as AI-Run:
    started:          null          # UTC, from the shell clock — never written from memory
    ended:            null
    timing:           {}            # total_s, engineer_wait_s, ai_active_s, sessions (run-tracking.md §4)
    skill_version:    null
    issue_id:         null
    source_sha:       null          # working-tree revision the analysis was authored against
    evidence_sha:     null          # digest of the supplied evidence set
    verdict:          null
    files_changed:    []
    deferred_items:   []

# ---------------------------------------------------------------------
# CODE REVIEW   (/autosar-code-review or /code-review)
# ---------------------------------------------------------------------
code_review:
  expected_row_count:  "?"          # [A] filter is SWC name ONLY (no related_modules)
  sw_req_ids:          []           # [N] explicit in-scope SW_Req IDs
  complexity_threshold: 15          # <-- confirm  HIS/cyclomatic limit
  reviewer:            "AI Reviewer"
  domain_model:                     # [A] §0.6 AUTO fields; derived once, confirmed, then reused
    signal_keyword_equivalents: AUTO
    upstream_producers:         AUTO
    domain_functional_checks:   AUTO
    rte_io_signatures:          AUTO

  last_run:                         # SKILL-OWNED ledger
    run_id:           null          # <skill>-<MODULE>-<UTC start> (run-tracking.md §1); commits carry it as AI-Run:
    started:          null          # UTC, from the shell clock — never written from memory
    ended:            null
    timing:           {}            # total_s, engineer_wait_s, ai_active_s, sessions (run-tracking.md §4)
    skill_version:      null
    source_sha:         null
    row_count_seen:     null
    mode:               null        # full | diff (diff: findings outside the diff are not re-checked)
    output:                         # the living Findings List — checked before every re-run (run-tracking.md §7)
      path:             null        # 20_AI/CodeReview/<MODULE>_CodeReview_Findings.xlsx
      hash:             null        # git hash-object at write time; differs later = authors edited it (expected)
    counts:             {}          # new / still_present / not_reproduced / not_rechecked / total_open
    checklist_coverage: {}          # walked / pass / fail / na / question counts

  finding_seq:  0                   # SKILL-OWNED  last finding number issued — numbers are never reused
  findings:     {}                  # SKILL-OWNED  stable finding register (review-quality.md "Living findings list"):
                                    #   CR-001: { fingerprint: "<tag-class>|<file>|<function>|<normalised code>",
                                    #             type: Major, first_run: <run_id>, last_seen_run: <run_id>,
                                    #             ai_recheck: present | not-reproduced | not-rechecked }
  statistics_map: {}                # SKILL-OWNED  where the Statistics sheet's counts live, confirmed once

# ---------------------------------------------------------------------
# UNIT TEST   (/autosar-unit-test or /unit-test)
# ---------------------------------------------------------------------
unit_test:
  env:                <MODULE_UPPER>   # derived  VectorCAST environment name
  subprograms:        all              # <-- confirm  all | [subprogram, ...]
  requirement_filter: all              # [A] all | [SW_Requ-ID, ...]
  sw_req_ids:         []               # [N] explicit IDs, or use release_filter
  release_filter:     N/A              # [N] e.g. 'aRequiredForRelease == "B0-Sample"'
  expected_row_count: "?"              # count gate — confirmed by the engineer on first run (never silently learned)
  stub_plan:          {}              # [N] siblings to STUB vs INCLUDE (e.g. stub SAPF_EH_*, motor3ph_*)

  last_run:                            # SKILL-OWNED ledger (in-place req -> case map)
    run_id:           null          # <skill>-<MODULE>-<UTC start> (run-tracking.md §1); commits carry it as AI-Run:
    started:          null          # UTC, from the shell clock — never written from memory
    ended:            null
    timing:           {}            # total_s, engineer_wait_s, ai_active_s, sessions (run-tracking.md §4)
    skill_version:           null
    source_sha:              null      # revision pinning (harmonized up from non-AUTOSAR)
    source_blob_hashes:      {}       # file -> git blob hash at author time
    requirements_source_sha: null
    requirements:            {}       # ID -> { hash, cases: [SAPF_Mode.001, ...] }
    coverage_only_cases:     []
    output:                            # the .tst this run wrote — checked before every re-run (run-tracking.md §7)
      path:                  null
      hash:                  null
