# =====================================================================
# QUALIFICATION-TEST MANIFEST (SWE.6)  —  feature: <FEATURE_NAME>
# ---------------------------------------------------------------------
# ONE per feature. INHERITS the per-repo test-spec config
# (20_AI/ai_test_project.yaml) — release, variants, environment,
# classification rule, and project-wide docs live there, NOT here. This
# file holds only FEATURE-specific inputs + the skill-owned run ledger.
#
# `last_run:` is SKILL-OWNED — do not hand-edit. It drives in-place
# re-runs and forms the audit trail.
#
# LOCATION (derived by the skill):
#   20_AI/manifests/qualification-test/<FEATURE_SLUG>.yaml
#   (FEATURE_SLUG = aFeature value, lowercased, non-alphanumeric runs -> "_")
# =====================================================================

schema_version: 1
inherits: 20_AI/ai_test_project.yaml

feature:
  name: <FEATURE_NAME>             # <-- fill   the exact aFeature value, e.g. "Actuator Data"
  slug: <FEATURE_SLUG>             # derived    e.g. actuator_data
  test_software: null              # "Series SW" | "Debug SW" — from docs.test_plan; asked once (Phase-1) when
                                    #   the Test Plan is absent or does not list the feature (patterns §8, atcRemark)

# PER-FEATURE documents (extend the project-wide docs.* in ai_test_project.yaml).
docs:
  existing_qualification_test_cases: <path or N/A>  # <-- fill  MANDATORY unless N/A by a recorded engineer decision
                                              #     (workflow-discipline §1.2) — this feature's slice of the existing
                                              #     qualification-test-spec export (exemplars + coverage baseline)
  extra: []                        # specifications a requirement cites (qualification-test-patterns §3.1), and
                                    #   any other document for a run — asked at Phase 1, then reused:
                                    #   - { path: <path or N/A>, title: "<document>", cited_version: "<as the
                                    #       requirement cites it>", supplied_version: "<as the file says>",
                                    #       cited_by: [<requirement IDs>], sections_read: [], reason_if_na: "" }
  run_instructions: ""             # optional free-text custom instructions for a run

scope:
  expected_row_count: "?"          # row-count gate — rows of the Test Cases sheet, confirmed as the last
                                    #   Phase-1 question (workflow-discipline §5), never silently learned
  requirement_ids: []              # optional — restrict this run to a subset; [] = all in-scope requirements

last_run:                          # SKILL-OWNED ledger
  timestamp:        null
  skill_version:    null
  release_id:       null           # release.id the run was authored against (baseline pinning)
  variants:         []
  input_hashes:     {}             # supplied file -> git hash-object result
  scope:                           # the scope this run was made at — if the next run's differs, it is a
                                    #   regeneration, not a per-requirement delta (workflow-discipline §8)
    feature:         null
    requirement_ids: []
  output:                          # the workbook this run wrote — checked before any in-place re-run
    path: null
    hash: null                     # git hash-object at write time; a different hash later = edited since
  supplied_but_not_read: {}        # input -> one-line reason it was not opened this run
  requirements:     {}             # requirement ID -> { hash, change_request: aChangeRequID, cases: [proposed titles] }
  review:           {}             # case title -> { isValid, reason } as the skill wrote them — tells QA's entries
                                    #   from the skill's own on the next run (workflow-discipline §8)
  open_points:      []
